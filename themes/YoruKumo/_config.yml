# 网站 | website
favicon: /images/favicon.ico
logo:
title: Kerui Wu's Blog

# 菜单 | menu
menu:
  Home: /
  About: /about

# 轮播图 | swiper
swiper:
  image: /images/blue_period.png
  title: 轮播图

# 页面布局
layout:
  stats: stats
  archive: archive
  category: category
  about: about

# 页脚 | footer
footer:
  count:
  since: 2025-01-01
  authorLink: https://keruiwu.github.io/
  themeLink: https://github.com/asukacc/YoruKumo

# 关于页面配置
about:
  name: 'Kerui Wu'
  website: 'https://keruiwu.github.io/' # 名字链接到的个人网站，留空则不加链接
  description: 'CS PhD student at UMass Amherst.'
  avatar: /images/avatar.jpg
  email: 'keruiwu@umass.edu'
  wechat:
  qq:
  github: 'https://github.com/keruiwu'
  linkedin: 'https://www.linkedin.com/in/kerui-wu-821a0a251/'

# GSAP 动画配置 | GSAP Animations Configuration
gsap:
  enable: true # 是否启用 GSAP 动画
  entrance_stagger: 0.08 # 列表项进场动画交错时间 (秒)
  scroll_trigger: true # 是否启用滚动触发渐现动画
  parallax: true # 是否启用顶部 Banner 视差滚动效果
  hover_effect: true # 是否启用卡片悬浮 GSAP 交互效果

# 多语言文章切换 | Post language switcher
language_switcher:
  label: Read in
  default: en
  order:
    - en
    - zh-CN
  labels:
    en: English
    zh-CN: 中文
    zh: 中文

# Theoretical computer science writing helpers
tcs:
  math: true # Load KaTeX assets and render $, $$, \( \), and \[ \] formulas

# 阅读量统计 | Page-view tracking (self-hosted Cloudflare Worker + KV)
# Backend lives in ./cloudflare-worker — deploy it, then paste the Worker URL
# into `endpoint` below. See cloudflare-worker/README.md for setup.
counter:
  enable: true # 是否启用阅读量统计
  # Your deployed Worker URL, e.g. https://blog-counter.<subdomain>.workers.dev
  endpoint: https://blog-counter.keruiwublog.workers.dev
  post_views: true # Show "views" under each post title
  site_stats: true # Show total site views + visitors in the footer
